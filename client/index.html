<!doctype html>
<!-- Site is forced-dark (ThemeProvider forcedTheme="dark"). Set the class
     statically so the first paint uses dark tokens — otherwise the light
     :root palette flashes (and trips the contrast audit on primary buttons)
     until next-themes adds the class on mount. -->
<html lang="en" class="dark" style="color-scheme: dark;">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>
    CodePlay Studios - Coding Your Vision | Smart Software Solutions
  </title>
  <meta name="description"
    content="CodePlay Studios builds AI-powered business systems, web apps, mobile solutions, and games. We deliver scalable, intelligent software tailored to your needs. Get a quote today." />
  <!-- Open Graph / Twitter tags are set per-route by components/SEO.tsx
       (react-helmet-async). Keeping static copies here as well produced
       duplicate og:title / og:type on article pages. -->
  <!-- Favicon set. Google Search needs a square icon that is a multiple of
       48px (48/96/144…) reachable at a stable URL; the old 128px
       favicon-32x32.png satisfied neither and Search fell back to the globe.
       /favicon.ico + /apple-touch-icon.png sit at the domain root because
       crawlers and iOS probe those fixed paths directly. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0f1729" />
  <link rel="alternate" type="application/rss+xml" title="CodePlay Insights" href="/insights/rss.xml" />

  <!-- LCP image lives in the JS bundle (hero carousel); preload so the
       browser fetches it without waiting for React to render the <img>. -->
  <link rel="preload" as="image" href="/assets/hero_web_dev_cartoon-640.webp" fetchpriority="high" />

  <!-- Fonts: Outfit (brand/display headlines) + Inter (ultra-legible editorial body) + JetBrains Mono (code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/outfit-latin.woff2" crossorigin />
  <style>
    @font-face {
      font-family: 'Outfit';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('/assets/fonts/outfit-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Outfit';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('/assets/fonts/outfit-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
