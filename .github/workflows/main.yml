name: Deploy to Shared Hosting

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build Project
        env:
          # Vite bakes VITE_* vars in at build time, not runtime - this has
          # to be set here, not just in a local .env file, or the deployed
          # site silently falls back to the localhost dev default.
          VITE_TOOLS_API_URL: https://api.codeplaystudios.com
        run: npm run build

      - name: 📂 Sync files (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 60000
          log-level: verbose
          local-dir: ./dist/public/
          dry-run: false
