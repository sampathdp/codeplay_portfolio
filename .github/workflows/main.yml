name: Deploy to Shared Hosting

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🗞️ Refresh Insights SEO artefacts (snapshot + sitemap + RSS)
        # Pulls published articles from Supabase and regenerates
        # client/src/data/insights.generated.ts, sitemap-insights.xml and
        # insights/rss.xml. Self-guards when Supabase env is absent and
        # never fails the deploy.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run insights:seo
        continue-on-error: true

      - name: 🏗️ Build Project
        env:
          # CodePlay Insights SEO / analytics / ads (Phase 8). All non-secret
          # — a GA4 id, an AdSense publisher id, a flag, a GSC token. Set as
          # repository *variables*; unset = feature renders nothing.
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
          VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_ENABLED: ${{ vars.VITE_ADSENSE_ENABLED }}
          VITE_GSC_VERIFICATION: ${{ vars.VITE_GSC_VERIFICATION }}
          # Vite bakes VITE_* vars in at build time, not runtime - this has
          # to be set here, not just in a local .env file, or the deployed
          # site silently falls back to the localhost dev default.
          VITE_TOOLS_API_URL: https://api.codeplaystudios.com
          # CodePlay Insights (optional). Both are anon-safe - RLS enforces
          # access. When unset the Insights admin page just reports "not
          # configured" and @supabase/supabase-js is tree-shaken out.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: 🧊 Prerender Insights article pages (static <head> for crawlers)
        # Writes dist/public/insights/<slug>/index.html per published
        # article, cloning the built index.html so JS still boots on top.
        # Same self-guard as insights:seo — never fails the deploy.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run insights:prerender
        continue-on-error: true

      - name: 📂 Sync files (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 60000
          log-level: verbose
          local-dir: ./dist/public/
          dry-run: false

      - name: 🔔 Ping IndexNow (Bing/Yandex)
        # Submits every sitemap URL to IndexNow after the host is updated.
        # Self-guards like the other insights: scripts — never fails the deploy.
        run: npm run insights:indexnow
        continue-on-error: true
