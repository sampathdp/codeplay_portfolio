name: Deploy Backend to Shared Hosting

on:
  push:
    branches:
      - main
      - master
    paths:
      - "Tools/backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  backend-deploy:
    name: 🐍 Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔄 Mark for Passenger restart
        # Passenger restarts the app whenever this file's mtime changes -
        # this is its standard "deploy" signal, so every push effectively
        # triggers a live restart once uploaded.
        run: |
          mkdir -p Tools/backend/tmp
          date -u > Tools/backend/tmp/restart.txt

      - name: 📂 Sync files (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./Tools/backend/
          # The FTP account lands in /home/<user>/codeplaystudios.com/ (the
          # frontend job deploys there with no server-dir override), but the
          # Python App's "Application root" is api.codeplaystudios.com
          # relative to the account HOME - a sibling one level up, not a
          # child of the frontend folder. Hence ../ here rather than ./.
          server-dir: ../api.codeplaystudios.com/
          exclude: |
            **/.venv/**
            **/__pycache__/**
            **/*.pyc
            **/Dockerfile
          dry-run: false
