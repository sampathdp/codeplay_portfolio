name: Deploy Backend to Shared Hosting

on:
  push:
    branches:
      - main
      - master
    paths:
      - "Tools/backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  backend-deploy:
    name: 🐍 Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔄 Mark for Passenger restart
        # Passenger restarts the app whenever this file's mtime changes -
        # this is its s  tandard "deploy" signal, so every push effectively
        # triggers a live restart once uploaded.
        run: |
          mkdir -p Tools/backend/tmp
          date -u > Tools/backend/tmp/restart.txt

      - name: 📂 Sync files (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.BACKEND_FTP_USERNAME }}
          password: ${{ secrets.BACKEND_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 60000
          log-level: verbose
          local-dir: ./Tools/backend/
          # The main FTP account (used by the frontend job) is chrooted to
          # the codeplaystudios.com folder - it can't reach the Python App's
          # actual root (a sibling folder) no matter what relative path is
          # given here, since it can't escape its own chroot. This uses a
          # second FTP account created specifically scoped to
          # /home/<user>/api.codeplaystudios.com/, so its root already IS
          # the right place - no server-dir override needed.
          exclude: |
            **/.venv/**
            **/__pycache__/**
            **/*.pyc
            **/Dockerfile
          dry-run: false
