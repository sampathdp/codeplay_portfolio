# Supabase CLI config for CodePlay Insights.
# Local dev:  supabase start   (needs Docker)
# Push schema: supabase db push --db-url "$SUPABASE_DB_URL"
project_id = "codeplay-insights"

[db]
major_version = 15

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[auth]
enable_signup = false
# Admins sign in via email magic link; there is no public signup.
[auth.email]
enable_signup = false
enable_confirmations = true

# Contact-form relay (see supabase/functions/contact). JWT verification
# must stay OFF: Supabase's gateway enforces it on the CORS preflight
# (OPTIONS) too, before the function's own OPTIONS handler ever runs —
# browsers never attach Authorization to a preflight, so the preflight
# itself gets rejected and no real POST is ever sent. The function does
# its own origin allowlist + input validation + honeypot instead.
[functions.contact]
verify_jwt = false
